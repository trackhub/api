name: CI tests
on: [pull_request]
jobs:
  fast-tests:
    runs-on: ubuntu-latest
    steps:
    - name: Check out repository code
      uses: actions/checkout@v26
    - name: Setup go
      uses: actions/setup-go@v5
      with:
        go-version: 1.27
    - name: check go version
      run: go version
    - name: "tests"
      run: |
        go test ./...
